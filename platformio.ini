; M5Stack Cardputer — Claude Code 承認用 BLEキーボード
; ESP32-S3 (StampS3) 向け設定
;
; ビルド:   pio run
; 書き込み: pio run -t upload
; シリアル: pio device monitor

[env:cardputer]
platform = espressif32@6.5.0
board = m5stack-stamps3
framework = arduino

; ESP32-S3 のUSBシリアル(CDC)を有効化。書き込み後のログ確認用。
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1

monitor_speed = 115200
upload_speed = 1500000

lib_deps =
	m5stack/M5Cardputer
	t-vk/ESP32 BLE Keyboard@^0.3.2
